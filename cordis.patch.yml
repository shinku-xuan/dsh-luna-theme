# Three rows, so each optional component can be switched off on its own.
#
# Turning one off needs no rebuild: add a patch entry to the profile's own
# `cordis.patch.yml` that names the row and disables it.
#
#   - id: luna-balance-widget
#     disabled: true
#   - id: luna-pet
#     disabled: true
#
# The two component rows name the package SUBPATH, not the package. Two rows
# naming the package root would register two active client sources for one
# package, which the client module system rejects as a composition error; a
# subpath row is not a client row, so only `dsh-luna-theme` carries this
# package's client half.
#
# The dependency runs one way: the page scripts of both components are injected
# by the theme's client bundle, so disabling `dsh-luna-theme` also removes the
# balance widget and the pet. Disabling either component leaves the rest alone.
- insert:
    - id: dsh-luna-theme
      name: dsh-luna-theme
    - id: luna-balance-widget
      name: dsh-luna-theme/widget
    - id: luna-pet
      name: dsh-luna-theme/pet
